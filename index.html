<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>History & Culture</title>

<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#171717">

<link rel="apple-touch-icon" href="images/icon-192.png">

</head>

<body>

<!-- ================= MENU BUTTON ================= -->

<button id="menu-button" class="menu-btn">
    ☰
</button>


<!-- ================= MENU ================= -->

<div class="menu">

    <h1>
        HISTORY<br>
        &amp; CULTURE
    </h1>

    <button id="close-menu" class="close-menu">
        ✕
    </button>

    <div class="menu-line"></div>

    <div class="menu-content">

        <div id="menu-pages"></div>

    </div>

    <div class="menu-footer">

        <div class="issue">
            ISSUE №01 • 2026
        </div>

        <div class="menu-nav">

            <button id="menu-prev">
                ←
            </button>

            <button id="menu-next">
                →
            </button>

        </div>

    </div>

</div>


<!-- ================= MAGAZINE VIEWER ================= -->

<div class="viewer">

    <div class="camera">

        <div id="book"></div>

    </div>

</div>


<!-- ================= DESKTOP NAVIGATION ================= -->

<button id="prev" class="page-arrow">
    ←
</button>

<button id="next" class="page-arrow">
    →
</button>


<!-- ================= DESKTOP BOTTOM BAR ================= -->

<div class="bottom-bar">

    <button
        id="bottom-prev"
        class="bottom-arrow"
    >
        ←
    </button>

    <div class="counter">
        HISTORY &amp; CULTURE
    </div>

    <button
        id="bottom-next"
        class="bottom-arrow"
    >
        →
    </button>

</div>


<!-- ================= PAGE FLIP LIBRARY ================= -->

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>


<!-- ================= MAIN SCRIPT ================= -->

<script src="script.js"></script>

</body>

</html>
